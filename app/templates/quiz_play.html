{% extends "base.html" %}
{% block title %}Quiz · Patente Quiz{% endblock %}
{% block content %}
<div class="row between">
  <h1 class="mb-0">{{ title }}</h1>
  <span class="chip accent">{{ index + 1 }} / {{ total }}</span>
</div>
<div class="progress"><span style="width:{{ ((index) / total) * 100 }}%"></span></div>

<div class="card accent" id="quiz-card">
  <div class="question-text">{{ question.text }}</div>
  <form id="quiz-form" hx-post="/quiz/answer" hx-target="#quiz-card" hx-swap="outerHTML"
        onsubmit="return false;">
    <input type="hidden" name="session_id" value="{{ session_id }}">
    <input type="hidden" name="question_id" value="{{ question.id }}">
    <input type="hidden" name="index" value="{{ index }}">
    <input type="hidden" name="total" value="{{ total }}">
    <div class="options">
      {% for o in question.options %}
      <label class="option">
        <input type="checkbox" name="option_ids" value="{{ o.id }}">
        <span class="letter">{{ ['a','b','c','d','e'][loop.index0] }}</span>
        <span>{{ o.text }}</span>
      </label>
      {% endfor %}
    </div>
    <div class="row mt-3">
      <button class="btn primary" type="submit">Conferma risposta</button>
      <span class="spacer"></span>
      <a class="btn ghost" href="/">Abbandona</a>
    </div>
  </form>
</div>
{% endblock %}
